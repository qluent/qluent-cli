[project]
name = "qluent-cli"
version = "0.1.9"
description = "CLI for Qluent metric tree analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "httpx>=0.25",
    "mcp>=1.0",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.0",
    "cryptography>=43.0",
]

[project.scripts]
qluent = "qluent_cli.main:cli"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qluent_cli = ["agent_instructions.md"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
