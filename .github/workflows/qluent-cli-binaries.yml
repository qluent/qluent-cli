name: Build Qluent CLI Binaries

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # Every target the npm installer can resolve in lib/installer.js must be
      # built here. A missing target is invisible until a user on that platform
      # runs `npm install -g @qluent/cli` and postinstall 404s.
      matrix:
        include:
          - os: macos-14
            artifact-pattern: "qluent-darwin-arm64*"
          # Intel macOS. `macos-13` was retired in December 2025; this label
          # is the supported x86_64 image and is available until August 2027,
          # after which GitHub drops x86_64 macOS entirely and darwin-x64 will
          # need cross-compilation under Rosetta on an arm64 runner.
          - os: macos-15-intel
            artifact-pattern: "qluent-darwin-x64*"
          - os: ubuntu-latest
            artifact-pattern: "qluent-linux-x64*"
          - os: ubuntu-24.04-arm
            artifact-pattern: "qluent-linux-arm64*"
          - os: windows-latest
            artifact-pattern: "qluent-windows-x64*"

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # Pinned exactly: setup-uv stopped publishing floating major tags
        # after v7, so `@v10` does not resolve.
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # --frozen builds the shipped artifact from uv.lock, the same dependency
      # set CI tested. A plain `pip install -e .[build]` re-resolves every
      # unbounded pin at build time, so the binary users receive is compiled
      # against versions no test has run: that is how 0.1.20 shipped with an
      # `mcp` 2.x that has no `Server.list_tools`, breaking `mcp serve` (#116).
      - name: Install build dependencies
        run: uv sync --frozen --no-dev --extra build --python 3.11

      - name: Build standalone binary
        run: uv run --frozen --no-dev --extra build python -m qluent_cli.build_binary

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: qluent-${{ runner.os }}-${{ runner.arch }}
          path: dist/binaries/${{ matrix.artifact-pattern }}
          if-no-files-found: error
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify the tag matches the committed version
        run: python3 scripts/bump_version.py --check "${GITHUB_REF_NAME#v}"

      - name: Verify every platform artifact is present
        run: |
          missing=0
          for artifact in \
            qluent-darwin-arm64 \
            qluent-darwin-x64 \
            qluent-linux-x64 \
            qluent-linux-arm64 \
            qluent-windows-x64.exe
          do
            if [ ! -f "release-assets/$artifact" ]; then
              echo "::error::Missing release artifact: $artifact"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "All 5 platform artifacts present."

      - name: Install signing dependencies
        run: python -m pip install "cryptography>=43.0"

      - name: Sign checksum files
        env:
          QLUENT_SIGNING_PRIVATE_KEY: ${{ secrets.QLUENT_SIGNING_PRIVATE_KEY }}
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          from cryptography.hazmat.primitives.serialization import load_pem_private_key

          private_key_pem = os.environ.get("QLUENT_SIGNING_PRIVATE_KEY")
          if not private_key_pem:
              raise SystemExit("QLUENT_SIGNING_PRIVATE_KEY is required for releases")

          private_key = load_pem_private_key(private_key_pem.encode(), password=None)
          checksum_paths = sorted(Path("release-assets").glob("*.sha256"))
          if not checksum_paths:
              raise SystemExit("No checksum files found to sign")

          for checksum_path in checksum_paths:
              signature = private_key.sign(checksum_path.read_bytes())
              sig_path = checksum_path.with_name(f"{checksum_path.name}.sig")
              sig_path.write_text(base64.b64encode(signature).decode() + "\n")
              print(f"Signed {sig_path}")
          PY

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: release-assets/*
          generate_release_notes: true
          # A tag carrying a prerelease suffix (v0.1.21-rc1) is marked as such,
          # so it never shows as the repository's latest release.
          prerelease: ${{ contains(github.ref_name, '-') }}

  npm-publish:
    # The installer downloads from the GitHub release, so the release must
    # exist before the package that points at it is published. Ordering this
    # after `release` is what makes an unresolvable install impossible.
    #
    # Publishing uses npm trusted publishing (OIDC): there is no npm token.
    # npmjs.com trusts this repository and THIS WORKFLOW FILENAME, so renaming
    # this file breaks publishing until the trusted publisher is updated. That
    # binding is also why the job lives here rather than in its own workflow —
    # a separate file could not express `needs: release`.
    #
    # Prerelease tags stop here. `npm publish` would tag the prerelease as
    # `latest` and serve it to every plain `npm install`, and a published npm
    # version cannot be taken back. A prerelease tag therefore exercises the
    # build and release path and leaves the registry alone.
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1; Node 22 still bundles npm 10.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Verify the tag matches the package version
        working-directory: npm
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match npm/package.json version $pkg_version"
            exit 1
          fi
          echo "Publishing @qluent/cli@$pkg_version"

      - name: Run installer tests
        working-directory: npm
        run: npm test

      # No token and no --provenance: trusted publishing authenticates over
      # OIDC and attaches provenance attestations automatically.
      - name: Publish to npm
        working-directory: npm
        run: npm publish --access public
